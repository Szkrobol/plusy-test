<div class="flex min-h-dvh flex-col bg-slate-50">
  <header class="sticky top-0 z-10 border-b border-slate-200 bg-white">
    <div class="mx-auto flex h-14 w-full max-w-5xl items-center justify-between gap-4 px-4">
      <a routerLink="/" class="flex min-w-0 items-center gap-2">
        <span class="truncate text-base font-semibold text-slate-900">
          {{ session.activeGroup()?.groupName }}
        </span>
        @if (session.isAdmin()) {
          <span class="rounded-full bg-slate-100 px-2 py-0.5 text-xs font-medium text-slate-700">
            Admin
          </span>
        }
      </a>

      @if (session.isAdmin()) {
        <nav class="mr-auto flex items-center gap-1 text-sm">
          <a
            routerLink="/admin/task-sets"
            routerLinkActive="bg-slate-100 text-slate-900"
            class="rounded-md px-3 py-1.5 font-medium text-slate-600 hover:bg-slate-50"
          >
            Zestawy zadań
          </a>
          <a
            routerLink="/admin/classes"
            routerLinkActive="bg-slate-100 text-slate-900"
            class="rounded-md px-3 py-1.5 font-medium text-slate-600 hover:bg-slate-50"
          >
            Zajęcia
          </a>
          <a
            routerLink="/admin/points"
            routerLinkActive="bg-slate-100 text-slate-900"
            class="rounded-md px-3 py-1.5 font-medium text-slate-600 hover:bg-slate-50"
          >
            Plusy
          </a>
        </nav>
      }

      <button
        mat-icon-button
        type="button"
        [matMenuTriggerFor]="userMenu"
        aria-label="Menu konta"
      >
        <mat-icon>account_circle</mat-icon>
      </button>
      <mat-menu #userMenu="matMenu" xPosition="before">
        <div class="max-w-64 px-4 py-2">
          @if (session.displayName(); as name) {
            <p class="truncate text-sm font-medium text-slate-900">{{ name }}</p>
          }
          <p class="truncate text-sm text-slate-600">{{ session.user()?.email }}</p>
        </div>
        <mat-divider />
        <a mat-menu-item routerLink="/profile">
          <mat-icon>person</mat-icon>
          <span>Mój profil</span>
        </a>
        <button mat-menu-item type="button" (click)="signOut()">
          <mat-icon>logout</mat-icon>
          <span>Wyloguj się</span>
        </button>
      </mat-menu>
    </div>
  </header>

  <main class="mx-auto w-full max-w-5xl flex-1 px-4 py-6">
    <router-outlet />
  </main>
</div>
